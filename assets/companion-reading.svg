<svg xmlns="http://www.w3.org/2000/svg" class="reading-computer" viewBox="0 0 220 170" aria-hidden="true"><style>
.computer-body { animation:bob 3s ease-in-out infinite; }
.note-pencil { animation:write .7s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:center; }
.computer-eyes { animation:blink 4s infinite; transform-box:fill-box; transform-origin:center; }
@keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-3px); } }
@keyframes write { from { transform:translate(0,0) rotate(-6deg); } to { transform:translate(4px,-2px) rotate(5deg); } }
@keyframes blink { 0%,43%,47%,100% { transform:scaleY(1); } 45% { transform:scaleY(.12); } }
@media(prefers-reduced-motion:reduce) { .computer-body,.note-pencil,.computer-eyes { animation:none; } }
</style>
